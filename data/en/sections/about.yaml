summary: |
  <div style="line-height: 1.9; letter-spacing: 0.03em; font-size: 1.05em; color: #333;">

  ### A Research Community to Learn Together and Pioneer the Future
  
  **HU-Tomorrow is a cross-disciplinary research community at Hiroshima University.**
  
  Breaking down disciplinary boundaries, we bring together students and researchers from diverse academic backgrounds. Under our motto of "Learning from everyone," we tackle future-oriented themes and new challenges.
  Unlike traditional seminars, our interactive format empowers participants to take the lead in their learning, creating a space where everyone can discover new perspectives and ideas.
  
  Participating in our activities is a solid achievement that you can proudly include on your CV, contributing significantly to your academic and personal growth.
  
  <br>
  
  <div style="background-color: #f8f9fa; padding: 1.5em 2em; border-radius: 12px; margin-bottom: 2em;">

  #### 💡 What We Value
  * **Interactive, two-way dialogue rather than one-way lectures**
  * **Connections that transcend labs and specialized fields**
  * **An environment that cultivates the seeds of young leadership**
  * **Future-oriented themes and challenges**
  * **A comfortable, flat discussion space that encourages active output**
  
  </div>
  
  <div style="background-color: #f8f9fa; padding: 1.5em 2em; border-radius: 12px; margin-bottom: 2em;">

  #### 🚀 Main Activities
  * **Regular Meetups**
    <span style="color: #666; font-size: 0.95em;">We hold regular gatherings to share the latest research topics and engage in free discussions. (Details are announced via flyers and the News section on this site.)</span>
  
  * **Annual Meeting**
    <span style="color: #666; font-size: 0.95em;">An open event featuring poster sessions and Flash Talks. It is designed to deepen cross-disciplinary interests and foster casual networking among participants.</span>
  
  * **New activities driven by YOUR ideas!**
    <span style="color: #666; font-size: 0.95em;">HU-Tomorrow is always looking for new ideas. We actively incorporate participants' feedback to evolve and expand our activities.</span>
  
  </div>
  
  <div style="background-color: #f4f8ff; padding: 1.5em 2em; border-radius: 12px; margin-bottom: 2em; border: 1px solid #dce8f6;">

  #### 🤝 To Those Considering Joining
  "I want to view my research from a different angle." "I want to meet peers with fascinating ideas." — If this sounds like you, you are more than welcome to join us!
  
  **Why not leverage the HU-Tomorrow platform to create and broadcast new value from Hiroshima University together?**
  
